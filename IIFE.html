<script>
    //IIFE-An IIFE (Immediately Invoked Function Expression) is a JavaScript function that runs as soon as it is defined.
    (function(){
        console.log("hello IIFE"); 
        //SHORT CODE USING ARROW FUNCTION
    })();
    (msg=>console.log("IFEE"))();

    //local storage-In JavaScript, localStorage is a property of the window object that allows web applications to store data as key-value pairs directly in the user's browser. 
    let myInfo={
        name:"aayush",
        Age:15,
        cousre:"b.tech",
        mobile:1234567890,
        };

        let myInfoData=JSON.stringify(myInfo);

         //set the data
        localStorage.setItem('prefrences',myInfoData);
        // get data
        let dataleak=localStorage.getItem('prefrences');
        //reterive the data and convert into JSON object
        let myInfopre=JSON.parse(dataleak);

        //acess keys
        console.log(myInfopre.Age);
        // high oder function-a Higher-Order Function (HOF) is a function that either takes one or more functions as arguments or returns a function as its result [4.4, 4.5]

        let num=[2,45,7,8,9,0,3,5,46,];
        let result=num.map(n=>n*2);
        console.log(result);
        let sum=num.reduce((total,n)=>total+n);
        console.log(sum);

      let bda=num.filter(n=>n>3);
      console.log(bda);

      num.forEach((n)=>console.log(n*n));
      console.log(`updated array is ${num}`);
