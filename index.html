    <h2>javascript</h2>
    <!-- JavaScript variables are named containers for storing data values. They are essential for holding information that can be used and changed throughout a program's execution. -->
     <script>
        var myName="Aayush";
        //The JavaScript document object represents the entire web page loaded in the browser, serving as the entry point to the page's content, known as the Document Object Model (DOM).
        document.write(myName)
        console.log(myName)


        function hello(){
            var msg="thanks to visit";
            console.log(msg)    
            document.write(msg)

        }
        hello();

        // varible declararion using let and const

        let myRollno=2503201000019;
        console.log(myRollno);
         myRollno=2503201000018; //NO redeclare but reassign
        console.log(myRollno);

    const myPhoneno=1234567890;

     myPhoneno=987654321;

     </script>
